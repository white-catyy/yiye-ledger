<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=412, initial-scale=1, viewport-fit=cover" />
    <title>一页账 · 首页视觉稿</title>
    <style>
      :root {
        --paper: #eef7fc;
        --paper-deep: #d9e9f2;
        --card: #fbfdff;
        --ink: #1d4962;
        --ink-soft: #547386;
        --muted: #89a4b5;
        --frost: #cdeaf8;
        --sky-deep: #7abedb;
        --aqua: #4c9fc4;
        --line: #ddeaf1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 412px;
        height: 915px;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family:
          MiSans, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button {
        color: inherit;
        font: inherit;
      }

      .phone {
        position: relative;
        width: 412px;
        height: 915px;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(circle at 83% 10%, rgba(160, 211, 236, 0.34), transparent 24%),
          var(--paper);
      }

      .phone::before {
        position: absolute;
        z-index: -1;
        top: 208px;
        right: -54px;
        width: 176px;
        height: 176px;
        border: 1px solid rgba(29, 73, 98, 0.09);
        border-radius: 50%;
        content: "";
      }

      .phone::after {
        position: absolute;
        z-index: -1;
        top: 229px;
        right: -31px;
        width: 130px;
        height: 130px;
        border: 1px dashed rgba(29, 73, 98, 0.11);
        border-radius: 50%;
        content: "";
      }

      .status-bar {
        display: flex;
        height: 34px;
        align-items: center;
        justify-content: space-between;
        padding: 7px 20px 0;
        color: var(--ink);
        font-size: 12px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
      }

      .status-icons {
        display: flex;
        height: 15px;
        align-items: center;
        gap: 7px;
      }

      .signal {
        display: flex;
        height: 12px;
        align-items: flex-end;
        gap: 1.5px;
      }

      .signal i {
        display: block;
        width: 2px;
        border-radius: 2px;
        background: var(--ink);
      }

      .signal i:nth-child(1) {
        height: 4px;
      }

      .signal i:nth-child(2) {
        height: 6px;
      }

      .signal i:nth-child(3) {
        height: 8px;
      }

      .signal i:nth-child(4) {
        height: 10px;
      }

      .wifi {
        width: 13px;
        height: 10px;
      }

      .battery {
        position: relative;
        width: 20px;
        height: 9px;
        border: 1.4px solid var(--ink);
        border-radius: 2.5px;
      }

      .battery::before {
        position: absolute;
        inset: 1.5px;
        width: 13px;
        border-radius: 1px;
        background: var(--ink);
        content: "";
      }

      .battery::after {
        position: absolute;
        top: 2px;
        right: -3.2px;
        width: 2px;
        height: 4px;
        border-radius: 0 2px 2px 0;
        background: var(--ink);
        content: "";
      }

      .page {
        padding: 14px 20px 0;
      }

      .topbar {
        display: flex;
        height: 38px;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        position: relative;
        width: 34px;
        height: 34px;
        overflow: hidden;
        border-radius: 11px 11px 4px 11px;
        background: var(--ink);
        box-shadow: 0 5px 12px rgba(29, 73, 98, 0.15);
      }

      .brand-mark::before {
        position: absolute;
        top: 8px;
        left: 9px;
        width: 16px;
        height: 17px;
        border-radius: 4px 4px 1px 1px;
        background: var(--card);
        content: "";
      }

      .brand-mark::after {
        position: absolute;
        right: 7px;
        bottom: 7px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--frost);
        content: "";
      }

      .brand-copy {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .brand-name {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.03em;
        line-height: 1.1;
      }

      .brand-subtitle {
        color: var(--muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.08em;
      }

      .date {
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .hero {
        position: relative;
        height: 164px;
        padding-top: 23px;
      }

      .hero-kicker {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-soft);
        font-size: 13px;
        font-weight: 600;
      }

      .hero-kicker::before {
        width: 18px;
        height: 2px;
        border-radius: 2px;
        background: var(--aqua);
        content: "";
      }

      .amount-row {
        position: relative;
        display: flex;
        height: 74px;
        align-items: flex-end;
        padding-top: 3px;
      }

      .currency {
        padding: 0 6px 10px 0;
        font-family: "DIN Alternate", Bahnschrift, "Microsoft YaHei UI", sans-serif;
        font-size: 26px;
        font-weight: 700;
        line-height: 1;
      }

      .amount {
        position: relative;
        z-index: 1;
        font-family: "DIN Alternate", Bahnschrift, "Microsoft YaHei UI", sans-serif;
        font-size: 62px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.055em;
        line-height: 0.92;
      }

      .highlighter {
        position: absolute;
        z-index: 0;
        bottom: 5px;
        left: 24px;
        width: 185px;
        height: 16px;
        border-radius: 58% 38% 46% 36%;
        background: var(--frost);
        opacity: 0.78;
        transform: rotate(-1.2deg);
      }

      .hero-meta {
        display: flex;
        height: 34px;
        align-items: center;
        gap: 8px;
      }

      .meta-badge {
        display: inline-flex;
        height: 27px;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        border-radius: 999px;
        background: rgba(251, 253, 255, 0.76);
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .meta-badge.good {
        background: rgba(205, 234, 248, 0.72);
        color: var(--ink);
      }

      .meta-badge svg {
        flex: 0 0 auto;
      }

      .ledger {
        position: relative;
        min-height: 396px;
        padding: 21px 18px 14px 47px;
        border: 1px solid rgba(29, 73, 98, 0.055);
        border-radius: 26px 26px 9px 26px;
        background: var(--card);
        box-shadow:
          0 18px 36px rgba(50, 82, 100, 0.075),
          0 2px 6px rgba(50, 82, 100, 0.035);
      }

      .ledger::before {
        position: absolute;
        top: 19px;
        bottom: 18px;
        left: 29px;
        border-left: 1px dashed rgba(76, 159, 196, 0.24);
        content: "";
      }

      .ledger::after {
        position: absolute;
        right: -1px;
        bottom: -1px;
        width: 24px;
        height: 24px;
        border-radius: 0 0 9px;
        background:
          linear-gradient(135deg, transparent 47%, #e6f1f7 49%, #fbfdff 58%);
        content: "";
      }

      .binding {
        position: absolute;
        top: 71px;
        left: 9px;
        display: flex;
        flex-direction: column;
        gap: 62px;
      }

      .binding i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--paper-deep);
        box-shadow: inset 0 1px 2px rgba(29, 73, 98, 0.16);
      }

      .ledger-header {
        display: flex;
        height: 35px;
        align-items: flex-start;
        justify-content: space-between;
      }

      .ledger-title-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .ledger-title {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .ledger-count {
        color: var(--muted);
        font-size: 10px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .ledger-note {
        margin-top: -2px;
        color: var(--aqua);
        font-size: 10px;
        font-weight: 700;
        transform: rotate(-2deg);
      }

      .entries {
        display: flex;
        flex-direction: column;
      }

      .entry {
        display: grid;
        min-height: 72px;
        grid-template-columns: 39px minmax(0, 1fr) auto;
        align-items: center;
        column-gap: 11px;
        border-bottom: 1px solid #e8f0f4;
      }

      .entry:last-child {
        border-bottom: 0;
      }

      .entry-icon {
        position: relative;
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 13px;
      }

      .entry-icon.breakfast {
        background: #dceff9;
        color: #397a99;
      }

      .entry-icon.lunch {
        background: #e3f4fb;
        color: #4c88a5;
      }

      .entry-icon.tea {
        background: #d4eaf7;
        color: #2f7899;
      }

      .entry-icon.book {
        background: #e7f2f7;
        color: #5d8191;
      }

      .entry-main {
        min-width: 0;
      }

      .entry-topline {
        display: flex;
        min-width: 0;
        align-items: baseline;
        gap: 7px;
      }

      .entry-name {
        overflow: hidden;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .entry-time {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 9.5px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .entry-note {
        overflow: hidden;
        margin-top: 2px;
        color: var(--ink-soft);
        font-size: 10.5px;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .entry-amount {
        min-width: 66px;
        padding-left: 6px;
        color: var(--ink);
        font-family: "DIN Alternate", Bahnschrift, "Microsoft YaHei UI", sans-serif;
        font-size: 14px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        text-align: right;
        white-space: nowrap;
      }

      .budget {
        margin-top: 13px;
        padding: 11px 1px 0;
      }

      .budget-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .budget-title {
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 600;
      }

      .budget-remaining {
        color: var(--ink);
        font-size: 10.5px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .budget-values {
        margin-top: 5px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: "DIN Alternate", Bahnschrift, "Microsoft YaHei UI", sans-serif;
        font-size: 15px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .budget-values small {
        color: var(--muted);
        font-family:
          MiSans, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI",
          sans-serif;
        font-size: 9.5px;
        font-weight: 500;
      }

      .progress {
        position: relative;
        height: 7px;
        margin-top: 8px;
        overflow: visible;
        border-radius: 999px;
        background: #dceaf1;
      }

      .progress-fill {
        width: 63.4%;
        height: 100%;
        border-radius: inherit;
        background: var(--ink);
      }

      .progress-knob {
        position: absolute;
        top: 50%;
        left: 63.4%;
        width: 13px;
        height: 13px;
        border: 3px solid var(--card);
        border-radius: 50%;
        background: var(--sky-deep);
        box-shadow: 0 1px 4px rgba(29, 73, 98, 0.2);
        transform: translate(-50%, -50%);
      }

      .fab {
        position: absolute;
        z-index: 5;
        right: 20px;
        bottom: 101px;
        display: flex;
        height: 52px;
        align-items: center;
        gap: 9px;
        padding: 0 17px 0 9px;
        border: 0;
        border-radius: 18px;
        background: var(--ink);
        box-shadow:
          0 12px 25px rgba(29, 73, 98, 0.22),
          0 3px 8px rgba(29, 73, 98, 0.12);
        color: var(--card);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.03em;
      }

      .fab-icon {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 12px;
        background: var(--frost);
        color: var(--ink);
      }

      .nav {
        position: absolute;
        z-index: 4;
        right: 0;
        bottom: 0;
        left: 0;
        height: 88px;
        padding: 8px 40px 17px;
        border-top: 1px solid rgba(29, 73, 98, 0.07);
        background: rgba(251, 253, 255, 0.94);
        box-shadow: 0 -8px 26px rgba(50, 82, 100, 0.04);
        backdrop-filter: blur(18px);
      }

      .nav-items {
        display: grid;
        height: 57px;
        grid-template-columns: repeat(3, 1fr);
      }

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 4px;
        color: #91a9b7;
        font-size: 10px;
        font-weight: 600;
      }

      .nav-icon {
        display: grid;
        width: 57px;
        height: 29px;
        place-items: center;
        border-radius: 999px;
      }

      .nav-item.active {
        color: var(--ink);
        font-weight: 800;
      }

      .nav-item.active .nav-icon {
        background: var(--frost);
      }

      .gesture-pill {
        position: absolute;
        bottom: 5px;
        left: 50%;
        width: 112px;
        height: 4px;
        border-radius: 999px;
        background: var(--ink);
        opacity: 0.82;
        transform: translateX(-50%);
      }
    </style>
  </head>
  <body>
    <main class="phone" aria-label="一页账 Android 首页视觉稿">
      <div class="status-bar" aria-hidden="true">
        <span>9:41</span>
        <div class="status-icons">
          <span class="signal"><i></i><i></i><i></i><i></i></span>
          <svg class="wifi" viewBox="0 0 16 12" fill="none">
            <path d="M1.3 4.1a10.2 10.2 0 0 1 13.4 0M3.7 6.6a6.5 6.5 0 0 1 8.6 0M6.1 9a2.9 2.9 0 0 1 3.8 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="8" cy="10.7" r="1" fill="currentColor" />
          </svg>
          <span class="battery"></span>
        </div>
      </div>

      <section class="page">
        <header class="topbar">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true"></div>
            <div class="brand-copy">
              <span class="brand-name">一页账</span>
              <span class="brand-subtitle">把日子记得轻一点</span>
            </div>
          </div>
          <time class="date" datetime="2026-10-21">10月21日 周三</time>
        </header>

        <section class="hero" aria-labelledby="today-spending">
          <div class="hero-kicker" id="today-spending">今天花了</div>
          <div class="amount-row">
            <span class="currency">¥</span>
            <span class="amount">86.50</span>
            <span class="highlighter" aria-hidden="true"></span>
          </div>
          <div class="hero-meta">
            <span class="meta-badge">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path d="M2 2.5h8v7H2zM3.5 4.4h5M3.5 6.4h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              4 笔流水
            </span>
            <span class="meta-badge good">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path d="m2.2 7.3 2.5-2.6 2 2 3.1-3.3M7.8 3.4h2v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              比昨天少 ¥12.40
            </span>
          </div>
        </section>

        <article class="ledger" aria-labelledby="ledger-title">
          <div class="binding" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <div class="ledger-header">
            <div class="ledger-title-wrap">
              <h1 class="ledger-title" id="ledger-title">今日流水</h1>
              <span class="ledger-count">已记 4 笔</span>
            </div>
            <span class="ledger-note">认真吃饭 ✓</span>
          </div>

          <div class="entries">
            <div class="entry">
              <div class="entry-icon breakfast" aria-hidden="true">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
                  <path d="M4 11h16c0 5-3.4 8-8 8s-8-3-8-8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                  <path d="M8.2 7.6c.8-1.7 2.4-2.6 4.2-2.6 1.7 0 3.1.8 4 2.1M6.4 20h11.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                  <path d="M9 4.7 10 3M12.2 4.6l.1-2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
                </svg>
              </div>
              <div class="entry-main">
                <div class="entry-topline">
                  <span class="entry-name">食堂早餐</span>
                  <time class="entry-time" datetime="2026-10-21T08:12">08:12</time>
                </div>
                <div class="entry-note">豆浆、鸡蛋和一个小包子</div>
              </div>
              <div class="entry-amount">−¥8.00</div>
            </div>

            <div class="entry">
              <div class="entry-icon lunch" aria-hidden="true">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
                  <path d="M4 11.2h16v1.4a8 8 0 0 1-16 0v-1.4Z" stroke="currentColor" stroke-width="1.6" />
                  <path d="M8.2 8.4c0-1 .8-1.8 1.8-1.8s1.8.8 1.8 1.8M13.3 8.4c0-1 .8-1.8 1.8-1.8s1.8.8 1.8 1.8M7.2 20h9.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                </svg>
              </div>
              <div class="entry-main">
                <div class="entry-topline">
                  <span class="entry-name">学校食堂</span>
                  <time class="entry-time" datetime="2026-10-21T12:06">12:06</time>
                </div>
                <div class="entry-note">一份照烧鸡饭</div>
              </div>
              <div class="entry-amount">−¥16.50</div>
            </div>

            <div class="entry">
              <div class="entry-icon tea" aria-hidden="true">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
                  <path d="M6 8h12l-1.2 11H7.2L6 8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                  <path d="M7.1 12h9.8M12 8V4.5M9.5 5.8 12 4l2.5 1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </div>
              <div class="entry-main">
                <div class="entry-topline">
                  <span class="entry-name">奶茶店</span>
                  <time class="entry-time" datetime="2026-10-21T15:40">15:40</time>
                </div>
                <div class="entry-note">芋泥波波，少糖</div>
              </div>
              <div class="entry-amount">−¥18.00</div>
            </div>

            <div class="entry">
              <div class="entry-icon book" aria-hidden="true">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
                  <path d="M4.5 5.1c2.7-.8 5.2-.2 7.5 1.5v13c-2.3-1.7-4.8-2.3-7.5-1.5v-13ZM19.5 5.1c-2.7-.8-5.2-.2-7.5 1.5v13c2.3-1.7 4.8-2.3 7.5-1.5v-13Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                </svg>
              </div>
              <div class="entry-main">
                <div class="entry-topline">
                  <span class="entry-name">校园书店</span>
                  <time class="entry-time" datetime="2026-10-21T18:24">18:24</time>
                </div>
                <div class="entry-note">专业参考书</div>
              </div>
              <div class="entry-amount">−¥44.00</div>
            </div>
          </div>
        </article>

        <section class="budget" aria-label="本月预算">
          <div class="budget-head">
            <span class="budget-title">10 月预算</span>
            <span class="budget-remaining">还剩 ¥732.00</span>
          </div>
          <div class="budget-values">
            <span>¥1,268.00 <small>/ ¥2,000</small></span>
            <small>已用 63%</small>
          </div>
          <div class="progress" aria-label="已使用 63%">
            <div class="progress-fill"></div>
            <div class="progress-knob"></div>
          </div>
        </section>
      </section>

      <button class="fab" type="button" aria-label="记一笔">
        <span class="fab-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M9 3.5v11M3.5 9h11" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </span>
